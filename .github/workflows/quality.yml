name: Quality and auth

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gud_crm_test
          POSTGRES_USER: gud
          POSTGRES_PASSWORD: gud-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gud -d gud_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run privacy:audit
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify combined voice updates with the isolated AI fixture
        run: node scripts/run-voice-e2e.mjs
      - name: Verify Thoughts explorations with the isolated AI fixture
        run: node scripts/run-thoughts-e2e.mjs
      - run: npm run build
      - run: npm run build:runtime-tools
      - name: Verify existing-data migrations and concurrent starts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: gud
          PGDATABASE: gud_crm_test
          PGPASSWORD: gud-ci-password
          GUD_RELEASE_TEST_DATABASE_URL: postgresql://gud:gud-ci-password@127.0.0.1:5432/gud_release_test
        run: |
          node --input-type=module -e "import { Pool } from 'pg'; const pool = new Pool(); await pool.query('CREATE DATABASE gud_release_test'); await pool.end();"
          npm run test:release:postgres
      - name: Verify personal Thoughts isolation on real PostgreSQL
        env:
          GUD_THOUGHTS_TEST_DATABASE_URL: postgresql://gud:gud-ci-password@127.0.0.1:5432/gud_release_test
        run: npx vitest run src/lib/data/thoughts-integration.test.ts
      - name: Exercise real PostgreSQL authentication
        env:
          DATA_BACKEND: postgres
          DATABASE_URL: postgresql://gud:gud-ci-password@127.0.0.1:5432/gud_crm_test
          BETTER_AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          GUD_BOOTSTRAP: if-empty
          SEED_ORGANISATION_NAME: Auth smoke workspace
          SEED_ADMIN_NAME: Auth Smoke Admin
          SEED_ADMIN_EMAIL: auth-smoke@gud.test
          SEED_ADMIN_PASSWORD: Auth-Smoke-Password-123!
          AUTH_SMOKE_EMAIL: auth-smoke@gud.test
          AUTH_SMOKE_PASSWORD: Auth-Smoke-Password-123!
        run: |
          cd .next/standalone
          node production-entrypoint.mjs > /tmp/gud-crm.log 2>&1 &
          cd ../..
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          node .next/standalone/container-healthcheck.mjs
          npm run auth:smoke
