services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gud_crm
      POSTGRES_USER: gud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gud -d gud_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql://gud:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@db:5432/gud_crm
      GUD_DEFAULT_MODEL: ${GUD_DEFAULT_MODEL:-focused}
      GUD_INSTANCE_NAME: ${GUD_INSTANCE_NAME:-GUD Sales}
      GUD_BOOTSTRAP: ${GUD_BOOTSTRAP:-off}
      SEED_ORGANISATION_NAME: ${SEED_ORGANISATION_NAME:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a 32+ character BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL:?Set the public HTTPS APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?Set the public HTTPS APP_URL}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
